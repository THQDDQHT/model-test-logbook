# 模型测试记录台 · Model Test Logbook
# 镜像模式（不从源码构建）：ghcr.io/thqddqht/model-test-logbook:latest
# 更新: docker compose pull && docker compose up -d
services:
  logbook:
    image: ghcr.io/thqddqht/model-test-logbook:latest
    container_name: model-test-logbook
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
      - "127.0.0.1:18788:8788"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      SEED: "0"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
