name: Release

# 打 tag 就发版（构建产物 + GitHub Release + 推送镜像到 ghcr.io）；
# 也可以在 Actions 页面手动触发一次，只产出 artifact 不发 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: 发版前跑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci
      - run: npm test

  package:
    name: 打包
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 计算版本号
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: 打 tar.gz 与 zip（去掉 data / node_modules / .git）
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          NAME="model-test-logbook-${VERSION}"
          mkdir -p "dist/${NAME}"
          rsync -a \
            --exclude '.git' --exclude 'data' --exclude 'node_modules' \
            --exclude 'dist' --exclude '.DS_Store' --exclude '*.log' \
            ./ "dist/${NAME}/"
          cd dist
          tar -czf "${NAME}.tar.gz" "${NAME}"
          zip -qr "${NAME}.zip" "${NAME}"
          sha256sum "${NAME}.tar.gz" "${NAME}.zip" | tee "${NAME}.sha256"
          ls -lh

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-test-logbook-${{ steps.version.outputs.value }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  docker:
    name: 推送镜像到 ghcr.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
